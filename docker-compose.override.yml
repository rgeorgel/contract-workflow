# Ajustes de desenvolvimento. O Compose lê este arquivo AUTOMATICAMENTE junto com o docker-compose.yml
# sempre que ele existe na pasta (docker compose up). Para ignorá-lo: docker compose -f docker-compose.yml ...
# ou COMPOSE_FILE=docker-compose.yml no .env.
#
# Aqui ficam: o Postgres local (no servidor o banco é externo), o Mailpit e as portas expostas para depurar.
# Para rodar a app com `dotnet run` fora do Docker: `docker compose up -d db mailpit s3 gotenberg`.
services:
  app:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
      # Em dev os e-mails vão para o Mailpit (http://localhost:8026), não para a Resend.
      Email__Provider: Smtp
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__Security: None
      # Em dev (e nos testes e2e) o limite de autenticação é folgado; em produção fica o padrão (10/min).
      RateLimiting__AuthPermitsPerMinute: "100"
      # API da plataforma ligada em dev com uma chave conhecida: os testes e2e trocam o plano das contas por ela.
      Platform__ApiKey: ${PLATFORM_API_KEY:-dev-platform-key-troque-por-uma-de-32-caracteres}
      # Em dev os webhooks podem apontar para http://localhost ou um container (ex.: um receptor de teste).
      Webhooks__AllowPrivateNetworks: "true"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Postgres local. Use DB_HOST=db no .env.
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-contratos}
      POSTGRES_USER: ${DB_USER:-contratos}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["${DB_PUBLISHED_PORT:-5434}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contratos}"]
      interval: 5s
      retries: 10

  backup:
    depends_on:
      db:
        condition: service_healthy

  s3:
    ports: ["${S3_PORT:-8333}:8333"]

  gotenberg:
    ports: ["${GOTENBERG_PORT:-3005}:3000"]

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"   # caixa de entrada: http://localhost:8026
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

volumes:
  pgdata:
