name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Testcontainers usa o Docker do runner para subir um Postgres real.
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Docker image
        run: docker build -f src/Contratos.Api/Dockerfile .

  e2e:
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sobe o sistema (app, Postgres, Gotenberg, S3, Mailpit)
        run: |
          cp .env.example.local .env
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fs http://localhost:7700/health/ready && break
            sleep 2
          done
          curl -fs http://localhost:7700/health/ready

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Logs da app se falhar
        if: failure()
        run: docker compose logs app --tail 200

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
