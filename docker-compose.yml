# Arquivo base: o que roda em qualquer ambiente. O banco fica FORA daqui (externo no servidor;
# em desenvolvimento, o docker-compose.override.yml sobe um Postgres local).
# Só este arquivo:  docker compose -f docker-compose.yml up -d   (ou COMPOSE_FILE=docker-compose.yml no .env)
services:
  app:
    build:
      context: .
      dockerfile: src/Contratos.Api/Dockerfile
    ports: ["${APP_PORT:-7700}:7700"]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=${DB_HOST:?Defina DB_HOST no .env - o banco fica fora deste compose};Port=${DB_PORT:-5432};Database=${DB_NAME:-contratos};Username=${DB_USER:-contratos};Password=${DB_PASSWORD:?Defina DB_PASSWORD no .env};SSL Mode=${DB_SSL_MODE:-prefer}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-false}
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:7700}
      Gotenberg__Url: http://gotenberg:3000
      Storage__ServiceUrl: ${S3_SERVICE_URL:-http://s3:8333}
      Storage__Bucket: ${S3_BUCKET:-contratos}
      Storage__AccessKey: ${S3_ACCESS_KEY}
      Storage__SecretKey: ${S3_SECRET_KEY}
      Signature__Provider: ${SIGNATURE_PROVIDER:-Fake}
      Autentique__ApiUrl: https://api.autentique.com.br/v2/graphql
      Autentique__ApiKey: ${AUTENTIQUE_API_KEY}
      Autentique__WebhookSecret: ${AUTENTIQUE_WEBHOOK_SECRET}
      Autentique__Sandbox: ${AUTENTIQUE_SANDBOX:-true}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Smtp__Username: ${SMTP_USERNAME}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__FromAddress: ${SMTP_FROM:-nao-responda@contratos.local}
      DataProtection__KeysPath: /data/keys
      ForwardedHeaders__Enabled: ${FORWARDED_HEADERS:-false}
      RateLimiting__ApiPermitsPerMinute: ${API_RATE_LIMIT_PER_MINUTE:-300}
    volumes:
      - keys:/data/keys
    depends_on:
      gotenberg:
        condition: service_started
      s3:
        condition: service_started

  gotenberg:
    image: gotenberg/gotenberg:8
    # Chromium só abre o próprio HTML: nada de rede interna (defesa extra contra SSRF além da sanitização).
    command: ["gotenberg", "--chromium-allow-list=^file:///tmp/.*", "--chromium-disable-javascript=true"]

  # S3 local. O MinIO parou de publicar imagens; o SeaweedFS fala o mesmo protocolo S3.
  # Em produção este serviço sai: aponte S3_SERVICE_URL, S3_BUCKET e as chaves para o S3 escolhido.
  s3:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - s3data:/data

  # Backup diário do banco com retenção: docker compose --profile backup up -d backup
  backup:
    image: postgres:17
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "/scripts/backup-db.sh", "--loop"]
    environment:
      PGHOST: ${DB_HOST}
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-contratos}
      PGDATABASE: ${DB_NAME:-contratos}
      PGPASSWORD: ${DB_PASSWORD}
      PGSSLMODE: ${DB_SSL_MODE:-prefer}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro

volumes:
  s3data:
  keys:
